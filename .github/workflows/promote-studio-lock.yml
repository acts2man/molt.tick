name: One-time Studio lockfile promotion
on:
  push:
    branches: [audit/engine-hardening]
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'Pin Studio dependency lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/engine-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact Studio lockfile
        run: npm --prefix studio install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if needed
        run: |
          if git diff --quiet -- studio/package-lock.json && git ls-files --error-unmatch studio/package-lock.json >/dev/null 2>&1; then
            echo "Studio lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/package-lock.json
          git commit -m "Pin Studio dependency lockfile"
          git push origin HEAD:audit/engine-hardening
