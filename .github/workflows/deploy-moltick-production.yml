name: Deploy Molt Studio production
on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'netlify.toml'
      - 'src/reconstruct/**'
      - 'scripts/studio-*.ts'
      - '.github/workflows/deploy-moltick-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-moltick-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.MOLT_NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 9e71d64e-4dfc-4195-a496-4ccfc73d8b63
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Studio dependencies
        run: npm --prefix studio ci --ignore-scripts --no-audit --no-fund
      - name: Build and deploy current main to production
        run: npx -y netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Molt production ${GITHUB_SHA}"
      - name: Record deployed commit
        run: echo "DEPLOYED_COMMIT=${GITHUB_SHA}"
