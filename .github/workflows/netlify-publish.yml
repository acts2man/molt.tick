name: Publish approved Molt Studio
on:
  push:
    branches: [feature/visual-reconstruction-engine]
    paths: [.github/workflows/netlify-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create an ephemeral deployment handoff key
        run: |
          node --input-type=module <<'JS'
          import { generateKeyPairSync } from 'node:crypto';
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const {publicKey,privateKey}=generateKeyPairSync('rsa',{modulusLength:4096,publicKeyEncoding:{type:'spki',format:'pem'},privateKeyEncoding:{type:'pkcs8',format:'pem'}});
          writeFileSync(process.env.RUNNER_TEMP+'/netlify-handoff-private.pem',privateKey,{mode:0o600});
          mkdirSync('deploy-handshake',{recursive:true});
          writeFileSync('deploy-handshake/public.json',JSON.stringify({runId:process.env.GITHUB_RUN_ID,siteId:'9e71d64e-4dfc-4195-a496-4ccfc73d8b63',sourceSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),publicKey},null,2));
          JS
      - name: Publish only the public encryption key
        uses: actions/upload-artifact@v4
        with:
          name: molt-deploy-handshake
          path: deploy-handshake/public.json
          retention-days: 1
      - name: Receive encrypted site-scoped deployment authorization and publish
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync,writeFileSync,rmSync } from 'node:fs';
          import { privateDecrypt,createDecipheriv,constants } from 'node:crypto';
          import { spawn } from 'node:child_process';
          const context=JSON.parse(readFileSync('deploy-handshake/public.json','utf8'));
          const aad=Buffer.from([context.runId,context.siteId,context.sourceSha].join(':'));
          const keyPath=process.env.RUNNER_TEMP+'/netlify-handoff-private.pem';
          let proxy='';
          try {
            const deadline=Date.now()+10*60_000;
            let envelope;
            while(Date.now()<deadline){
              const response=await fetch(`https://api.github.com/repos/acts2man/molt.tick/contents/.github/ops/netlify-${context.runId}.json?ref=feature%2Fvisual-reconstruction-engine`,{headers:{Authorization:`Bearer ${process.env.READ_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15_000)});
              if(response.ok){const data=await response.json();envelope=JSON.parse(Buffer.from(data.content,'base64').toString('utf8'));break;}
              if(response.status!==404)throw new Error(`Handoff lookup failed (${response.status})`);
              await new Promise(r=>setTimeout(r,10_000));
            }
            if(!envelope||envelope.runId!==context.runId)throw new Error('No matching encrypted deployment authorization was received');
            const aes=privateDecrypt({key:readFileSync(keyPath),oaepHash:'sha256',padding:constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(envelope.key,'base64'));
            const decipher=createDecipheriv('aes-256-gcm',aes,Buffer.from(envelope.iv,'base64'));decipher.setAAD(aad);decipher.setAuthTag(Buffer.from(envelope.tag,'base64'));
            const payload=JSON.parse(Buffer.concat([decipher.update(Buffer.from(envelope.ciphertext,'base64')),decipher.final()]).toString('utf8'));
            if(typeof payload.proxy!=='string'||!payload.proxy.startsWith('https://netlify-mcp.netlify.app/proxy/')||payload.expires<Date.now())throw new Error('Invalid or expired site deployment handoff');
            proxy=payload.proxy;
            console.log('::add-mask::'+proxy);
            console.log('::add-mask::'+proxy.split('/proxy/')[1]);
            rmSync(keyPath,{force:true});
            rmSync('deploy-handshake',{recursive:true,force:true});
            const env={};for(const name of ['PATH','HOME','LANG','TMPDIR'])if(process.env[name])env[name]=process.env[name];env.CI='1';
            const result=await new Promise(resolve=>{
              const child=spawn('npx',['-y','@netlify/mcp@latest','--site-id',context.siteId,'--proxy-path',proxy],{cwd:process.cwd(),env,stdio:['ignore','pipe','pipe']});
              let output='';const capture=d=>{output=(output+d).slice(-80_000);};child.stdout.on('data',capture);child.stderr.on('data',capture);
              const timer=setTimeout(()=>{child.kill('SIGKILL');},8*60_000);
              child.on('error',e=>{clearTimeout(timer);resolve({code:1,output:e.message});});
              child.on('close',code=>{clearTimeout(timer);resolve({code:code??1,output});});
            });
            const clean=result.output.split(proxy).join('[deployment authorization redacted]').split(proxy.split('/proxy/')[1]).join('[redacted]');
            console.log(clean);
            writeFileSync(process.env.RUNNER_TEMP+'/molt-netlify-deploy.txt',clean);
            if(result.code!==0)throw new Error(`Netlify publisher exited ${result.code}`);
          } finally {rmSync(keyPath,{force:true});}
          JS
      - name: Install public deployment-check dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --with-deps chromium
      - name: Inspect the actual published UI and protected API
        env:
          MOLT_NO_SANDBOX: '1'
        run: ./node_modules/.bin/tsx scripts/studio-live-test.ts
      - name: Preserve public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molt-netlify-publication
          path: |
            studio-live-output/
            ${{ runner.temp }}/molt-netlify-deploy.txt
          retention-days: 7
      - name: Destroy any remaining ephemeral private key
        if: always()
        run: rm -f "$RUNNER_TEMP/netlify-handoff-private.pem"
