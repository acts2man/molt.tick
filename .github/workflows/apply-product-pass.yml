name: Apply reviewed product integration
on:
  push:
    branches: [feature/product-experience]
    paths: [.github/workflows/apply-product-pass.yml, scripts/product-edits-a.jsonl, scripts/product-edits-b.jsonl]
permissions:
  contents: write
concurrency:
  group: apply-product-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'acts2man/molt.tick' && github.ref == 'refs/heads/feature/product-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the checksum-verified local development edits
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          allowed={'README.md','netlify.toml','scripts/studio-browser-test.ts','scripts/studio-live-test.ts','scripts/studio-run.ts','src/reconstruct/agent.ts','src/reconstruct/capture.ts','src/reconstruct/provider.ts','src/reconstruct/types.ts','studio/index.html','studio/server/app.ts','studio/server/contracts.ts','studio/src/App.tsx','studio/src/main.tsx','studio/src/styles.css','studio/test/server.test.ts'}
          patches={}
          for filename in ['scripts/product-edits-a.jsonl','scripts/product-edits-b.jsonl']:
            for line in pathlib.Path(filename).read_text().splitlines():
              if line.strip():
                item=json.loads(line)
                if set(item)&set(patches): raise RuntimeError('Duplicate file')
                patches.update(item)
          if set(patches)!=allowed: raise RuntimeError('Unexpected source scope')
          results={}
          for filename,patch in patches.items():
            source=pathlib.Path(filename).read_text()
            if hashlib.sha256(source.encode()).hexdigest()!=patch['before']: raise RuntimeError('Base checksum differs: '+filename)
            previous=0
            for start,end,replacement in patch['edits']:
              if not (previous<=start<=end<=len(source)) or not isinstance(replacement,str): raise RuntimeError('Invalid edit')
              previous=end
            for start,end,replacement in reversed(patch['edits']): source=source[:start]+replacement+source[end:]
            if hashlib.sha256(source.encode()).hexdigest()!=patch['after']: raise RuntimeError('Output checksum differs: '+filename)
            results[filename]=source
          for filename,source in results.items(): pathlib.Path(filename).write_text(source)
          print('Verified and applied',len(results),'reviewed source files')
          PY
      - name: Verify the integrated source without provider credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix studio install --no-audit --no-fund
          npm run typecheck
          npm test
          npm --prefix studio run build
          npm --prefix studio test
      - name: Commit integration to the feature branch only
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,os,base64
          files=[]
          for name in ['scripts/product-edits-a.jsonl','scripts/product-edits-b.jsonl']:
            for line in pathlib.Path(name).read_text().splitlines():
              if line.strip(): files.extend(json.loads(line))
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Integrate verified public landing, owner onboarding and usage accounting'],check=True)
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_WRITE_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:refs/heads/feature/product-experience'],check=True)
          PY
