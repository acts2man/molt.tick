name: Verify Molt production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-moltick-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.MOLT_NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 9e71d64e-4dfc-4195-a496-4ccfc73d8b63
    steps:
      - name: Wait for this exact commit to reach Netlify production
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "MOLT_NETLIFY_AUTH_TOKEN is missing"
            exit 1
          fi
          echo "Waiting for Netlify production deploy for ${GITHUB_SHA}"
          for attempt in $(seq 1 90); do
            payload="$(curl --fail --silent --show-error --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys?per_page=20")"
            state="$(PAYLOAD="${payload}" EXPECTED="${GITHUB_SHA}" node -e "const rows=JSON.parse(process.env.PAYLOAD||'[]'); const d=rows.find(x=>String(x.commit_ref||'')===process.env.EXPECTED && String(x.context||'')==='production'); console.log(d?String(d.state||'unknown'):'missing');")"
            case "${state}" in
              ready)
                echo "Verified Netlify production is serving commit ${GITHUB_SHA}"
                exit 0
                ;;
              error|failed|canceled|cancelled)
                echo "Netlify production deploy for ${GITHUB_SHA} entered terminal state: ${state}"
                exit 1
                ;;
              *)
                echo "Attempt ${attempt}/90: ${state}; waiting..."
                sleep 10
                ;;
            esac
          done
          echo "Timed out waiting for Netlify production deploy for ${GITHUB_SHA}"
          exit 1
